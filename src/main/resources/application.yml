spring:
  datasource:
    url: jdbc:h2:mem:springbooksdb
    driverClassName: org.h2.Driver
    username: springbooks
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs
